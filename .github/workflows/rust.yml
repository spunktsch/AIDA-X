# Rust rewrite (crates/): test, lint, bundle (CLAP + VST3) and release (TICKET-013).
#
# The shipping C++/DPF plugin is still built by build.yml, which stays untouched until the
# Rust plugin replaces it. Only the RTNeural submodule is needed here (its Eigen and json
# copies are in-tree; its nested xsimd submodule and dpf/dr_libs/FFTConvolver/r8brain/
# dpf-widgets are only used by the C++ build), so checkout skips the other submodules.
#
# No apt packages are installed: aidadx_plugin uses nih-plug with default features off
# (no standalone/jack/alsa, no GUI/X11/OpenGL), so the Linux build only needs the runner's
# C++ compiler. Add the nih-plug system deps here once a GUI or standalone target lands.

name: rust

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RTNeural submodule
        run: git submodule update --init --depth 1 modules/rtneural
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: ""
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: ""
          - name: windows-x64
            os: windows-latest
            target: ""
          - name: macos-arm64
            os: macos-14
            target: ""
          # Cross-compiled on the arm64 runner. No universal binary yet: the xtask wrapper
          # (xtask/src/main.rs) only implements `bundle`, not nih_plug_xtask's
          # `bundle-universal`. Tests are not run for this target.
          - name: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RTNeural submodule
        shell: bash
        run: git submodule update --init --depth 1 modules/rtneural
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: cargo test
        if: matrix.target == ''
        run: cargo test --workspace --locked

      - name: Bundle plugin (CLAP + VST3)
        shell: bash
        run: |
          if [[ -n "${{ matrix.target }}" ]]; then
            cargo xtask bundle aidadx_plugin --release --locked --target "${{ matrix.target }}"
          else
            cargo xtask bundle aidadx_plugin --release --locked
          fi
          ls -la target/bundled

      - name: Package bundles (zip + SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          archive="AIDA-X-${{ matrix.name }}.zip"
          mkdir -p dist
          cd target/bundled
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip "../../dist/$archive" AIDA-X.clap AIDA-X.vst3
          else
            # -y keeps symlinks inside macOS bundles as symlinks.
            zip -r -y "../../dist/$archive" AIDA-X.clap AIDA-X.vst3
          fi
          cd ../../dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: AIDA-X-${{ matrix.name }}
          path: |
            dist/AIDA-X-${{ matrix.name }}.zip
            dist/AIDA-X-${{ matrix.name }}.zip.sha256
          if-no-files-found: error

  # clap-validator + pluginval on the bundles built above. Non-blocking until the pinned
  # validator URLs in scripts/validate-plugin.* have been verified by a first run.
  validate:
    name: validate (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AIDA-X-${{ matrix.name }}
          path: dist

      - name: Validate (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "AIDA-X-${{ matrix.name }}.zip.sha256")
          mkdir -p target/bundled
          unzip -q -o "dist/AIDA-X-${{ matrix.name }}.zip" -d target/bundled
          # pluginval needs an X display even when only validating.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a bash scripts/validate-plugin.sh --skip-bundle

      - name: Validate (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force target\bundled | Out-Null
          Expand-Archive -Force "dist\AIDA-X-${{ matrix.name }}.zip" target\bundled
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\validate-plugin.ps1 -SkipBundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AIDA-X-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -c ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          ls -la
      # No codesigning/notarization yet (needs Apple/Windows signing secrets).
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
