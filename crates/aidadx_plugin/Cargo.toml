[package]
name = "aidadx_plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "VST3 and CLAP plugin backends for AIDA-X neural amp modeler"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
aidadx_core = { path = "../aidadx_core", features = ["candle"] }

clap-ffi = { version = "1.2", optional = true, features = [
    "params",
    "audio-ports",
    "state",
    "audio-processing",
] }
aurix = { version = "0.4", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[features]
default = ["clap"]
clap = ["dep:clap-ffi"]
vst3 = ["dep:aurix"]
