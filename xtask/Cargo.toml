[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Plugin bundler for AIDA-X (`cargo xtask bundle aidadx_plugin --release`)"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0"
cargo_metadata = "0.18.1"
# Same nih-plug revision as crates/aidadx_plugin, so the bundler matches the exported wrappers.
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
